spring.application.name=hotel-aventura
server.port=8080

# Base de datos SQL persistente en disco (Modo PostgreSQL) - Soporta variables DB_URL / DB_USER / DB_PASSWORD para Supabase activo
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/hotel_aventura_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

supabase.url=${SUPABASE_URL:https://vkwyflxorhikeayusxbf.supabase.co}
supabase.key=${SUPABASE_KEY:tu_supabase_service_role_key}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:imagenes}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


