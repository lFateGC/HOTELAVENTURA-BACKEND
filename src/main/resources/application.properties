spring.application.name=hotel-aventura
server.port=8080

# ===================================================================
# 1. CONEXIÓN A BASE DE DATOS SUPABASE (PostgreSQL)
# ===================================================================
# Obtener credenciales en el Panel de Supabase:
# Supabase Dashboard -> Project Settings -> Database -> Connection string -> URI
# Ejemplo Directo: jdbc:postgresql://db.[PROJECT-REF].supabase.co:5432/postgres?sslmode=require
# Ejemplo Pooler (recomendado): jdbc:postgresql://aws-0-[REGION].pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.url=${DB_URL:jdbc:postgresql://db.vkwyflxorhikeayusxbf.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:tu_password_de_supabase}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===================================================================
# 2. CONEXIÓN A SUPABASE STORAGE (Bucket de Imágenes)
# ===================================================================
# Credenciales reales de tu proyecto en Supabase (HotelAventura)
supabase.url=${SUPABASE_URL:https://vkwyflxorhikeayusxbf.supabase.co}
supabase.key=${SUPABASE_KEY:tu_supabase_service_role_key}

# Nombre del bucket público creado en Supabase Storage
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:imagenes}

# ===================================================================
# 3. LÍMITES DE SUBIDA MULTIPART (Imágenes)
# ===================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# 4. FORMATEO DE FECHAS JSON (ISO-8601)
# ===================================================================
spring.jackson.serialization.write-dates-as-timestamps=false
